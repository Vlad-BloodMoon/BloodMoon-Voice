name: Synchronize corrected WebRTC .3 modules and public release instructions

on:
  push:
    paths:
      - .github/workflows/sync-webrtc3-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VOICE_TAG: v1.0.0
      OPENSIM_TAG: v0.9.3.1-webrtc.3
      ZIP_NAME: WebRTC_Modules_BloodMoon_0.9.3.1-webrtc.3.zip
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching binaries and update documentation assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p old new oldcontent newcontent
          gh release download "$VOICE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir old
          gh release download "$OPENSIM_TAG" --repo Vlad-BloodMoon/opensim --pattern "$ZIP_NAME" --dir new
          unzip -q "old/$ZIP_NAME" -d oldcontent
          unzip -q "new/$ZIP_NAME" -d newcontent
          for file in WebRtcVoice.dll WebRtcVoice.pdb WebRtcVoiceRegionModule.dll WebRtcVoiceRegionModule.pdb WebRtcVoiceServiceModule.dll WebRtcVoiceServiceModule.pdb; do
            a="$(find oldcontent -name "$file" -type f -print -quit)"
            b="$(find newcontent -name "$file" -type f -print -quit)"
            test -n "$a" && test -n "$b"
            cmp "$a" "$b" || { echo "Binary changed unexpectedly: $file"; exit 1; }
          done
          ! grep -R -E -n 'bloodmoonpack[.]com/adhocconf/wolf_api[.]php' newcontent --include='*.md' --include='*.example' --include='*.ini' --include='*.txt'
          cp "new/$ZIP_NAME" .
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          sha256sum -c "$ZIP_NAME.sha256"
          gh release upload "$VOICE_TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "# BloodMoon Voice v1.0.0 — validated BloodMoon WebRTC server"
            echo
            echo "Source baseline: [WolfVoice BloodMoon v0.2.0-bloodmoon.4](https://github.com/Vlad-BloodMoon/wolfvoice/releases/tag/v0.2.0-bloodmoon.4). The server executable and compiled OpenSimulator DLL/PDB files remain byte-identical to the verified production-derived release."
            echo
            echo "For the **correct matching OpenSimulator modules**, use [v0.9.3.1-webrtc.3](https://github.com/Vlad-BloodMoon/opensim/releases/tag/v0.9.3.1-webrtc.3). This release also includes that exact ZIP, with public config examples changed to neutral placeholder domains."
            echo
            echo "For complete ad-hoc conferences, separately deploy the PHP/MySQL API from [OpenSimulator-AdHocConferences](https://github.com/Vlad-BloodMoon/OpenSimulator-AdHocConferences) and configure YOUR OWN conference endpoint. **The example `https://conference.example.org/adhocconf/wolf_api.php` is not a working service.**"
            echo
            echo "Read the [three-repository installation guide](https://github.com/Vlad-BloodMoon/BloodMoon-Voice/blob/main/docs/COMPLETE_STACK.md)."
            echo
            echo "**Do not install an older AdHoc regional DLL over the tested .3 DLL. Do not distribute production voice keys or use BloodMoon's private endpoint without authorization.**"
            echo
            echo "The original historic install archive is retained for provenance; use **BloodMoon-Voice-installer-v1.0.0.tar.gz** for new installations."
            echo
            echo "## Original release details"
            cat docs/RELEASE-v0.2.0-bloodmoon.4.md
          } > notes.md
          gh release edit "$VOICE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Updated Voice release with matched .3 binaries and safe examples."
